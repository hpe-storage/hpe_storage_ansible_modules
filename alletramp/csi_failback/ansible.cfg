[defaults]
inventory            = inventory/hosts.yml
collections_path     = ./collections
roles_path           = ./collections/ansible_collections/hpe/csi_failback/roles
host_key_checking    = False
# Use the built-in callback with YAML rendering rather than the old
# `community.general.yaml` stdout callback. That plugin was removed in
# community.general 12.0.0 (superseded by `result_format=yaml` in
# ansible.builtin.default since ansible-core 2.13); leaving it configured makes
# every playbook abort at startup with
# "ERROR! Invalid callback for stdout specified: yaml".
stdout_callback      = default
result_format        = yaml
bin_ansible_callbacks = True
retry_files_enabled  = False
interpreter_python   = auto_silent
# Keep the log; the audit story depends on it.
log_path             = ./reports/ansible.log
# Never print credentials even at -vvv.
no_log               = False
display_skipped_hosts = False

[inventory]
unparsed_is_failed = True
