#
# The orchestrator runs entirely on the control node. There are no managed
# hosts: every operation is an HTTPS call to a WSAPI endpoint or to the
# Kubernetes API server. This is what keeps the tool out of the data path.
all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"
